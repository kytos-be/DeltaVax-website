on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: latest

      - name: Install R packages
        run: |
            Rscript -e 'install.packages("pak", repos="https://cloud.r-project.org")'
            Rscript -e 'pak::pkg_install(c(
              "knitr",
              "rmarkdown",
              "tidyverse",
              "scales",
              "kableExtra"
            ))'
            
      - name: Verify kableExtra
        run: Rscript -e 'library(kableExtra); packageVersion("kableExtra")'

      - name: Render site
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
